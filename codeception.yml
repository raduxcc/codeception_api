namespace: Tests

support_namespace: Support

paths:
    tests: tests
    output: tests/_output
    data: tests/Support/Data
    support: tests/Support
    envs: tests/Envs

settings:
    colors: true

actor_suffix: Tester

extensions:
    enabled:
        - Codeception\Extension\RunFailed
        - Qameta\Allure\Codeception\AllureCodeception
    config:
        Qameta\Allure\Codeception\AllureCodeception:
            outputDirectory: allure-results
